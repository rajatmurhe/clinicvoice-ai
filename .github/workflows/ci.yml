name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: ./backend
        run: npm install
      - name: Run unit tests
        working-directory: ./backend
        run: npm test

  python-agents-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./python-agents
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit and regression tests
        working-directory: ./python-agents
        run: python -m pytest tests -q
      - name: Run offline eval (no network, no LLM)
        run: python python-eval/run_eval.py --out-dir python-eval/results-ci
      - name: Check eval thresholds
        run: python python-eval/check_thresholds.py python-eval/results-ci/eval-offline.json

  deploy-render:
    # Deploys to Render only after the test and eval jobs pass, and only when
    # the RENDER_DEPLOY_HOOK secret is configured on the repo.
    needs: [backend-unit-tests, python-agents-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook if configured
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -sf -X POST "$HOOK"
            echo "Render deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK secret not set; skipping deploy"
          fi

  nestjs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: ./nest-api
        run: npm install
      - name: Build
        working-directory: ./nest-api
        run: npm run build

  nextjs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./next-frontend
        run: npm install
      - name: Build
        working-directory: ./next-frontend
        run: npm run build
